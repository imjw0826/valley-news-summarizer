name: 주간 시황뉴스 요약

on:
  schedule:
    # 매주 토요일 08:00 KST (= 금요일 23:00 UTC)
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "수집할 최근 일수"
        default: "7"
      provider:
        description: "요약 모델 (deepseek 또는 claude)"
        type: choice
        options: [deepseek, claude]
        default: deepseek

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 뉴스 수집 및 요약
        env:
          VALLEY_EMAIL: ${{ secrets.VALLEY_EMAIL }}
          VALLEY_PASSWORD: ${{ secrets.VALLEY_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python valley_news.py \
            --days "${{ inputs.days || '7' }}" \
            --provider "${{ inputs.provider || 'deepseek' }}" \
            --telegram

      - name: 요약 문서 보관
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: output/*.md
          retention-days: 90
